{% extends "base.html" %}

{% block title %}Ingia{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 80px auto;">
    <h1 style="text-align: center; margin-bottom: 10px;">🎵 Kwaya</h1>
    <h2 style="text-align: center; margin-bottom: 30px;">Mt. Bonifasi</h2>
    <hr style="margin-bottom: 30px;">
    
    <form method="POST">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Username</label>
            <input type="text" name="username" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;" required>
        </div>
        
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold;">Password</label>
            <input type="password" name="password" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;" required>
        </div>
        
        <button type="submit" class="btn" style="width: 100%;">🔐 Ingia</button>
    </form>
    
    <div style="margin-top: 25px; padding: 15px; background: #f8f9fa; border-radius: 8px; text-align: center;">
        <p style="margin: 0;"><strong>Demo Login:</strong></p>
        <p style="margin: 5px 0 0;">admin / admin123</p>
    </div>
</div>
{% endblock %}
